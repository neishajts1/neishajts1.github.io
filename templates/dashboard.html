<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Precipitaciones - Río Guey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
    
    <style>
        /* Estilos específicos para el dashboard */
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.1);
            margin-bottom: 30px;
            position: relative;
            height: 400px; /* Altura fija para evitar saltos */
        }
        .control-panel {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #90caf9;
        }
        h2 { color: #1565c0; font-weight: 700; font-size: 1.5rem; margin-bottom: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow" style="background: #1565c0;">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="#">Atlas Río Guey</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link text-white active" href="#">Dashboard Climático</a></li>
                    </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        
        <div class="text-center mb-4">
            <h1>Indicadores de Precipitación <br><span>Estación Fagro UCV</span></h1>
            <p class="text-muted">Análisis histórico de datos 1973 - 2015</p>
        </div>

        <div class="row">
            <div class="col-lg-6 col-12 mb-4">
                <div class="control-panel d-flex align-items-center gap-3">
                    <label class="fw-bold">Seleccionar Año:</label>
                    <select id="yearSelect" class="form-select w-auto">
                        {% for ano in anios %}
                        <option value="{{ ano }}" {% if ano == 2015 %}selected{% endif %}>{{ ano }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>

            <div class="col-lg-6 col-12 mb-4">
                <div class="control-panel row g-2 align-items-center">
                    <div class="col-auto"><label class="fw-bold">Desde:</label></div>
                    <div class="col">
                        <input type="number" id="startYear" class="form-control" value="1990" min="1973" max="2015">
                    </div>
                    <div class="col-auto"><label class="fw-bold">Hasta:</label></div>
                    <div class="col">
                        <input type="number" id="endYear" class="form-control" value="2015" min="1973" max="2015">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary btn-sm" onclick="updateAnnualChart()">Actualizar</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="annualChart"></canvas>
                </div>
            </div>
        </div>

        <div id="footer" class="text-center mt-5">
            <p style="color: white; margin-bottom: 0;">© 2025 Atlas Temático de Indicadores Ambientales - UCV</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
