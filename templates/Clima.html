<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clima | Cuenca Río Güey</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:'Montserrat',Arial,sans-serif;
    background:linear-gradient(135deg,#e8f5e9,#ffffff);
}
.chart-container{height:190px;}
.card{border-radius:14px; box-shadow:0 6px 14px rgba(0,0,0,.08);}
#interpretacion{font-size:.9rem;color:#2e7d32;}
</style>
</head>

<body>
<div class="container py-4">

<div class="text-center mb-3">
    <img src="../images/logo ucv.png" width="90">
</div>

<div class="text-center mb-4">
    <h1>Clima <span class="text-success">| Cuenca Río Güey</span></h1>
    <a href="../index.html" class="btn btn-primary btn-sm mt-2">← Regresar</a>
</div>

<div class="row g-4">

<div class="col-lg-6">
<div class="card p-3">
<label class="fw-bold">Precipitación mensual</label>
<select id="anioMensual" class="form-select mb-2"></select>
<div class="chart-container"><canvas id="graficaMensual"></canvas></div>
<p id="resumenMensual" class="mt-2 text-muted small"></p>
</div>
</div>

<div class="col-lg-6">
<div class="card p-3">
<label class="fw-bold">Precipitación promedio anual</label>

<div class="mb-2">
<button class="btn btn-success btn-sm me-2" onclick="seleccionarTodos()">Seleccionar todos</button>
<button class="btn btn-outline-secondary btn-sm" onclick="limpiar()">Limpiar</button>
</div>

<div id="checkboxAnios" class="mb-2"></div>

<div class="chart-container"><canvas id="graficaAnual"></canvas></div>

<p id="interpretacion" class="mt-2"></p>
</div>
</div>

</div>
</div>

<script src="../static/js/clima.js"></script>
</body>
</html>
