<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Precipitación | Fagro UCV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>
<div class="container py-4">

    <h2 class="text-center mb-4">
        Dashboard de Precipitación<br>
        <small class="text-muted">FAGRO – UCV (1973–2015)</small>
    </h2>

    <!-- AÑO INDIVIDUAL -->
    <div class="card mb-4 shadow">
        <div class="card-body">
            <h5>Precipitación por Año</h5>

            <select id="yearSelect" class="form-select mb-3"></select>

            <div class="row text-center mb-3">
                <div class="col stat">Total<br><span id="total"></span></div>
                <div class="col stat">Promedio<br><span id="avg"></span></div>
                <div class="col stat">Máximo<br><span id="max"></span></div>
                <div class="col stat">Mínimo<br><span id="min"></span></div>
            </div>

            <canvas id="chartYear"></canvas>
        </div>
    </div>

    <!-- MULTIANUAL -->
    <div class="card shadow">
        <div class="card-body">
            <h5>Comparación Multianual</h5>

            <div id="yearsBox" class="checkbox-container mb-3"></div>

            <canvas id="chartMulti"></canvas>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
