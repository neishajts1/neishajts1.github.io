<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Proyecto con AdminLTE</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
      href="adminlte/plugins/bootstrap/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
      href="adminlte/plugins/fontawesome-free/css/all.min.css">

    <!-- AdminLTE -->
    <link rel="stylesheet" href="adminlte/dist/css/adminlte.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilos.css">
  </head>
  <body class="hold-transition sidebar-mini">
    <div class="wrapper">

      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Botón de menú -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#"><i
                class="fas fa-bars"></i></a>
          </li>
        </ul>
        <span class="ml-3 font-weight-bold">Panel de Control</span>
      </nav>

      <!-- Sidebar -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Logo -->
        <a href="#" class="brand-link">
          <i class="fas fa-leaf brand-image img-circle elevation-3"></i>
          <span class="brand-text font-weight-light">Mi Proyecto</span>
        </a>

        <!-- Menú lateral -->
        <div class="sidebar">
          <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" role="menu">
              <li class="nav-item">
                <a href="index.html" class="nav-link active">
                  <i class="nav-icon fas fa-home"></i>
                  <p>Inicio</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="nav-icon fas fa-cog"></i>
                  <p>Configuración</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Contenido principal -->
      <div class="content-wrapper">
        <section class="content p-4">
          <div class="container-fluid">
            <h1 class="text-center">Bienvenido a AdminLTE</h1>
            <p class="text-center">Este es un proyecto base con AdminLTE, HTML,
              CSS y JS.</p>
          </div>
        </section>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Temperatura promedio por mes (°C)</h3>
          </div>
          <div class="card-body">
            <canvas id="tempPromChart" height="120"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Temperatura por mes (°C)</h3>
          </div>
          <div class="card-body">
            <canvas id="tempMensualChart" height="120"></canvas>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <footer class="main-footer text-center">
        <strong>© 2025 Mi Proyecto</strong>
      </footer>

    </div>

    <!-- Scripts -->
    <script src="adminLTE/plugins/jquery/jquery.min.js"></script>
    <script
      src="adminLTE/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@latest/dist/Chart.min.js"></script>
    <script src="adminLTE/dist/js/adminlte.min.js"></script>
    <script src="js/app.js"></script>

  </html>
