<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../icon/style.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    <style>
        /* Basic reset and background from your original */
        html, body {
            background-color: #02220b; /* Color de fondo original */
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%; /* Asegura que el cuerpo ocupe toda la altura */
            overflow-x: hidden; /* Previene el desbordamiento horizontal */
            font-family: Arial, sans-serif; /* Fuente base */
        }

        /* Styles for OpenLayers controls from your existing HTML */
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        }
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Responsive map style - this will be overridden and enhanced by estilos.css */
        #map {
            width: 100%; /* Ocupa el ancho completo de su contenedor */
            height: 60vh; /* Altura relativa al viewport (60% de la altura visible) */
            /* Se pueden añadir max-width y margin auto en estilos.css si se desea centrar un mapa con ancho máximo */
        }

        /* Responsive popup styles - can be further refined in estilos.css */
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px; /* OpenLayers puede ajustar esto */
            min-width: 200px; /* Ancho mínimo del popup */
            max-width: 90vw; /* Ancho máximo relativo al viewport */
            font-size: 14px;
            word-wrap: break-word; /* Para que el texto largo se ajuste */
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }
        .ol-popup:after {
            border-top-color: white;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }
        .ol-popup:before {
            border-top-color: #cccccc;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }
        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 2px;
            right: 8px;
            color: #333;
        }
        .ol-popup-closer:after {
            content: "✖";
        }
        #popup-content {
             font-size: 0.9em;
        }

    </style>
    <title>Mapa Cuenca Río Guey</title>
    <link rel="icon" href="./images/favicon.ico">
</head>

<body>
    <header>
        <div class="container-header">
            <div class="container-logo-title">
                <img src="../images/ucvlogo.png" alt="Logo UCV">
                <h1><strong>UCV NÚCLEO MARACAY</strong></h1>
            </div>
            <h1>
                <br>
                <span style="color: aquamarine;">Localización y Delimitación de la Cuenca del Río Güey</span>
            </h1>
        </div>
    </header>

    <main>
        <a href="../index.html" class="regresar-link">
            <span class="icon-home">Regresar</span>
        </a>
        <br> <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/polyfills.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="http://cdn.polyfill.io/v2/polyfill.min.js?features=Element.prototype.classList,URL"></script>
        <script src="resources/horsey.min.js"></script>
        <script src="resources/ol3-search-layer.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="layers/CuencaRioGuey_1.js"></script>
        <script src="layers/DepartamentoseInstitutos_2.js"></script>
        <script src="styles/CuencaRioGuey_1_style.js"></script>
        <script src="styles/DepartamentoseInstitutos_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <p class="fuente-elaboracion"><b>Fuente:</b> Elaboración propia (2023)</p>
        </main>
    <script>
        window.addEventListener('resize', function() {
  if (typeof map !== 'undefined' && map) {
    map.updateSize();
  }
});
    </script>
</body>
</html>
