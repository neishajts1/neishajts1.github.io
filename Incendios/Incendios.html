<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Mapa de Incendios del PNHP - Cuenca Río Güey</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../images/favicon_io/favicon.ico">
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- FontAwesome -->
        <link rel="stylesheet" href="../css/animate/animate.css">
        <link rel="stylesheet" href="../css/estilos.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <!-- OpenLayers y estilos de qgis2web -->
        <link rel="stylesheet" href="resources/ol.css">
        <link rel="stylesheet" href="resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="resources/qgis2web.css">
        <link rel="stylesheet"
            href="resources/photon-geocoder-autocomplete.min.css">
        <style>
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%);
            font-family: 'Montserrat', Arial, sans-serif;
        }
        #logo h1 {
            color: #1565c0;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0;
        }
        #logo span {
            color: #43a047;
            font-weight: 400;
        }
        .btn-regresar {
            background: #1565c0;
            color: #fff !important;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(21,101,192,0.08);
            margin-bottom: 1.5rem;
        }
        .btn-regresar:hover {
            background: #43a047;
            color: #fff !important;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 24px rgba(21,101,192,0.18);
        }
        #map {
            width: 100%;
            min-height: 400px;
            height: 60vh;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(21,101,192,0.08);
        }
        @media (max-width: 768px) {
            #map {
                height: 50vh;
                min-height: 300px;
            }
            #logo h1 {
                font-size: 1.2rem;
            }
        }
    </style>
        <title>Mapa de Incendios del PNHP - Cuenca Río Güey</title>

    <body>

            </div>
            <div class="text-center">

                </a>
            </div>
            <div class="row justify-content-center">
                <div class="col-12">
                    <div id="map">
                        <div id="popup" class="ol-popup">
                            <a href="#" id="popup-closer"
                                class="ol-popup-closer"></a>
                            <div id="popup-content"></div>
                        </div>
                    </div>
                </div>
            </div>
            <script src="resources/qgis2web_expressions.js"></script>

            <script src="layers/Ao1990_2.js"></script>
            <script src="layers/Ao1998_3.js"></script>
            <script src="layers/Ao2003_4.js"></script>
            <script src="layers/Ao2014_5.js"></script>
            <script src="layers/Ao2017_6.js"></script>
            <script src="layers/Ao2018_7.js"></script>
            <script src="layers/Ao2019_8.js"></script>
            <script src="layers/Ao2020_9.js"></script>

            <script src="styles/Ao1990_2_style.js"></script>
            <script src="styles/Ao1998_3_style.js"></script>
            <script src="styles/Ao2003_4_style.js"></script>
            <script src="styles/Ao2014_5_style.js"></script>
            <script src="styles/Ao2017_6_style.js"></script>
            <script src="styles/Ao2018_7_style.js"></script>
            <script src="styles/Ao2019_8_style.js"></script>
            <script src="styles/Ao2020_9_style.js"></script>
            <script src="./layers/layers.js" type="text/javascript"></script>
            <script src="./resources/Autolinker.min.js"></script>
            <script src="./resources/qgis2web.js"></script>
            <script
                src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
